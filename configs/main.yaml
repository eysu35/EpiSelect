defaults:
  - model: 124M
  - loader: commonpile_episelect
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_

rundir: null    # local path or gs:// URI
seed: 0
tag: null       # optional wandb tag
debug: false    # skip checkpointing and wandb logging
multihost: true # initialize the JAX distributed runtime (TPU pods)

learning_rate: 1e-3
min_lr: 1e-5
beta2: 0.95
weight_decay: 1e-4
warmup_steps: 500
lr_decay_steps: 60000
max_steps: 60000

batch_size: 256  # global across all devices
block_size: 1024
g_accum_iters: 1
param_dtype: float32
compute_dtype: bfloat16
shard_model: false

eval_interval: 1000

hydra:
  output_subdir: null
  run:
    dir: .
